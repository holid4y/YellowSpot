name: Build YellowSpot APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK="$HOME/android-sdk"
          CLT="$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$CLT/bin/sdkmanager" ]; then
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$CLT"
          fi
          yes | "$CLT/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$CLT/bin/sdkmanager" --sdk_root="$SDK" 'platforms;android-37.1' 'build-tools;37.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Assemble ARM64 debug APK
        run: gradle --no-daemon assembleDebug
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YellowSpot-POCO-X7-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.2"
          APK="YellowSpot-0.3.2-arm64-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" --title "YellowSpot 0.3.2" \
            --notes "ARM64 debug APK (versionCode 5, v0.3.2) for the Xiaomi POCO X7 Pro / HyperOS. Fixes the startup crash: the engine now ships the GeckoView stable channel (Firefox 159) instead of a nightly build, and adds on-device diagnostics (tap the flag in the top bar to share the log). Same pinned signing key as v0.3.1, so this installs as an in-place update over v0.3.1." \
            --latest || true
          gh release upload "$TAG" "$APK" --clobber
